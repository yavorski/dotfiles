<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>kitty</string></test>
    <edit name="family" mode="append" binding="strong"><string>JetBrainsMonoNL Nerd Font</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname"><string>ghostty</string></test>
    <edit name="family" mode="append" binding="strong"><string>JetBrainsMonoNL Nerd Font</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname"><string>alacritty</string></test>
    <edit name="family" mode="append" binding="strong"><string>JetBrainsMonoNL Nerd Font</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
